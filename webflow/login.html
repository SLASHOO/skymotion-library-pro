  const form = document.getElementById("smlLoginForm");
  const emailInput = document.getElementById("sml-email");
  const passwordInput = document.getElementById("sml-password");
  const submitBtn = document.getElementById("smlLoginBtn");
  const errorBox = document.getElementById("smlLoginError");
  const successBox = document.getElementById("smlLoginSuccess");
  const loadingNote = document.getElementById("smlLoadingNote");
  const resetBtn = document.getElementById("smlResetBtn");
  const googleBtn = document.getElementById("smlGoogleLoginBtn");
  const watchBtn = document.getElementById("smlWatchGuideBtn");
  const modal = document.getElementById("smlVideoModal");
  const closeBtn = document.getElementById("smlCloseVideoModal");
  const videoEmbed = document.getElementById("smlVideoEmbed");
  let isSubmitting = false;
  function showError(message) {
    if (!errorBox) return;
    errorBox.textContent = message || "Something went wrong. Please try again.";
    errorBox.classList.add("is-visible");
    if (successBox) {
      successBox.classList.remove("is-visible");
      successBox.textContent = "";
    }
    if (loadingNote) {
      loadingNote.classList.remove("is-visible");
    }
  }
  function showSuccess(message) {
    if (!successBox) return;
    successBox.textContent = message || "Success.";
    successBox.classList.add("is-visible");
    if (errorBox) {
      errorBox.classList.remove("is-visible");
      errorBox.textContent = "";
    }
  }
  function clearMessages() {
    if (errorBox) {
      errorBox.classList.remove("is-visible");
      errorBox.textContent = "";
    }
    if (successBox) {
      successBox.classList.remove("is-visible");
      successBox.textContent = "";
    }
    if (loadingNote) {
      loadingNote.classList.remove("is-visible");
    }
  }
  function replaceMemberstackErrorMessages() {
    const replacements = {
      "Please login with your email.": "This account was created with email and password. Please log in with email and password.",
      "Please login with your email": "This account was created with email and password. Please log in with email and password."
    };
    function replaceTextNode(node) {
      if (!node || node.nodeType !== Node.TEXT_NODE) return;
      Object.keys(replacements).forEach(function (oldText) {
        if (node.nodeValue && node.nodeValue.includes(oldText)) {
          node.nodeValue = node.nodeValue.replace(oldText, replacements[oldText]);
        }
      });
    }
    function scanNode(node) {
      if (!node) return;
      if (node.nodeType === Node.TEXT_NODE) {
        replaceTextNode(node);
        return;
      }
      if (node.childNodes && node.childNodes.length) {
        node.childNodes.forEach(scanNode);
      }
    }
    scanNode(document.body);
    const observer = new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        mutation.addedNodes.forEach(scanNode);
      });
    });
    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  }
  function setSubmitting(active, text) {
    isSubmitting = active;
    if (submitBtn) {
      submitBtn.disabled = active;
      submitBtn.textContent = text || "LOG IN";
    }
  }
  async function waitForMemberstackDom(retries = 20, delay = 250) {
    for (let i = 0; i < retries; i++) {
      if (window.$memberstackDom?.loginMemberEmailPassword) {
        return window.$memberstackDom;
      }
      await new Promise(resolve => setTimeout(resolve, delay));
    }
    return null;
  }
  function extractMember(result) {
    return (
      result?.data?.member ||
      result?.data ||
      result?.member ||
      null
    );
  }
  async function waitForMember(retries = 10, delay = 250) {
    const memberstack = await waitForMemberstackDom();
    if (!memberstack?.getCurrentMember) return null;
    for (let i = 0; i < retries; i++) {
      try {
        const result = await memberstack.getCurrentMember();
        const member = extractMember(result);
        if (member) return member;
      } catch (e) {}
      await new Promise(resolve => setTimeout(resolve, delay));
    }
    return null;
  }
  function hasProPlan(member) {
    if (!member) return false;
    const conns = member.planConnections;
    if (!Array.isArray(conns)) return false;
    return conns.some(function (pc) {
      if (!pc) return false;
      const id = pc.planId || (pc.plan && pc.plan.id);
      if (id !== PRO_PLAN_ID) return false;
      if (pc.active === false) return false;
      if (pc.status && /cancel|expired|inactive|past_due/i.test(String(pc.status))) return false;
      return true;
    });
  }
  function destFor(member) {
    return hasProPlan(member) ? PRO_REDIRECT : FREE_REDIRECT;
  }
  function goHome(member) {
    const dest = destFor(member);
    try {
      if (window.top && window.top !== window) {
        window.top.location.href = dest;
        return;
      }
    } catch (e) {}
    window.location.href = dest;
  }
  async function redirectIfAlreadyLoggedIn() {
    const memberstack = await waitForMemberstackDom();
    if (!memberstack?.getCurrentMember) return false;
    try {
      const result = await memberstack.getCurrentMember();
      const member = extractMember(result);
      if (member) {
        goHome(member);
        return true;
      }
    } catch (e) {}
    return false;
  }
  function startGoogleRedirectWatcher() {
    let attempts = 0;
    const maxAttempts = 60;
    if (loadingNote) {
      loadingNote.textContent = "Checking login...";
      loadingNote.classList.add("is-visible");
    }
    const timer = setInterval(async function () {
      attempts++;
      const redirected = await redirectIfAlreadyLoggedIn();
      if (redirected || attempts >= maxAttempts) {
        clearInterval(timer);
        if (!redirected && loadingNote) {
          loadingNote.classList.remove("is-visible");
        }
      }
    }, 500);
  }
  function openModal() {
    if (!modal) return;
    modal.classList.add("is-open");
    modal.setAttribute("aria-hidden", "false");
    const video = videoEmbed?.querySelector("video");
    if (video) video.play().catch(() => {});
  }
  function closeModal() {
    if (!modal) return;
    modal.classList.remove("is-open");
    modal.setAttribute("aria-hidden", "true");
    const video = videoEmbed?.querySelector("video");
    if (video) {
      video.pause();
      video.currentTime = 0;
    }
  }
  if (watchBtn) {
    watchBtn.addEventListener("click", openModal);
  }
  if (closeBtn) {
    closeBtn.addEventListener("click", closeModal);
  }
  if (modal) {
    modal.addEventListener("click", function (e) {
      if (e.target === modal) closeModal();
    });
  }
  if (googleBtn) {
    googleBtn.addEventListener("click", function () {
      clearMessages();
      if (loadingNote) {
        loadingNote.textContent = "Opening Google login...";
        loadingNote.classList.add("is-visible");
      }
      setTimeout(startGoogleRedirectWatcher, 1200);
    });
  }
  if (form) {
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      if (isSubmitting) return;
      clearMessages();
      const email = emailInput ? emailInput.value.trim().toLowerCase() : "";
      const password = passwordInput ? passwordInput.value : "";
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !password) {
        showError("Enter your email and password.");
        return;
      }
      if (!emailRegex.test(email)) {
        showError("Please enter a valid email, for example name@gmail.com.");
        return;
      }
      try {
        setSubmitting(true, "LOGGING IN...");
        const memberstack = await waitForMemberstackDom();
        if (!memberstack?.loginMemberEmailPassword) {
          throw new Error("Memberstack is not ready. Please refresh the page.");
        }
        await memberstack.loginMemberEmailPassword({
          email: email,
          password: password
        });
        const member = await waitForMember();
        if (!member) {
          throw new Error("Login completed, but session was not detected.");
        }
        showSuccess("Login successful. Opening SkyMotion...");
        if (loadingNote) {
          loadingNote.textContent = "Opening SkyMotion...";
          loadingNote.classList.add("is-visible");
        }
        if (AUTO_REDIRECT_AFTER_LOGIN) {
          goHome(member);
        }
      } catch (error) {
        console.error("SM LOGIN V4 email login error:", error);
        showError(error?.message || "Access denied. Check your email and password.");
        setSubmitting(false);
      }
    });
  }
  if (resetBtn) {
    resetBtn.addEventListener("click", async function () {
      clearMessages();
      const email = emailInput ? emailInput.value.trim().toLowerCase() : "";
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email) {
        showError("Enter your email first, then request a reset link.");
        return;
      }
      if (!emailRegex.test(email)) {
        showError("Please enter a valid email, for example name@gmail.com.");
        return;
      }
      try {
        resetBtn.disabled = true;
        resetBtn.textContent = "Sending...";
        const memberstack = await waitForMemberstackDom();
        if (!memberstack?.sendMemberResetPasswordEmail) {
          throw new Error("Password reset is not available.");
        }
        await memberstack.sendMemberResetPasswordEmail({ email: email });
        showSuccess("Password reset email sent. Check your inbox.");
      } catch (error) {
        console.error("SM LOGIN V4 reset error:", error);
        showError(error?.message || "Could not send reset email.");
      } finally {
        resetBtn.disabled = false;
        resetBtn.textContent = "Forgot password?";
      }
    });
  }
  window.addEventListener("focus", function () {
    setTimeout(redirectIfAlreadyLoggedIn, 700);
  });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) {
      setTimeout(redirectIfAlreadyLoggedIn, 700);
    }
  });
  window.addEventListener("pageshow", function () {
    if (loadingNote) loadingNote.classList.remove("is-visible");
    setSubmitting(false);
    setTimeout(redirectIfAlreadyLoggedIn, 700);
  });
  replaceMemberstackErrorMessages();
  setTimeout(redirectIfAlreadyLoggedIn, 1000);
  console.log("SM LOGIN V4 rendered — final version");
})();
</script>
